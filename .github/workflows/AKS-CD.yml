name: AKS-CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      branch:
        description: "Release Branch"
        required: true
        default: "V5.0"

      image_id:
        description: "Docker Image ID (Example: 5.0.123)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read


#Adding comment to generate the PR for trigger
    steps:

      # Checkout branch
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # Validation Step
      - name: Validate Branch, Image and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          set -e

          BRANCH="${{ github.event.inputs.branch }}"
          IMAGE="${{ github.event.inputs.image_id }}"

          echo "Branch: $BRANCH"
          echo "Image: $IMAGE"

          # Extract version from branch
          VERSION=$(echo "$BRANCH" | sed 's/V//')

          echo "Expected Version: $VERSION"

          # Validate image format
          # Example allowed:
          # 5.0.1
          # 5.0.25

          if [[ ! "$IMAGE" =~ ^${VERSION}\.[1-9][0-9]*$ ]]; then
            echo "Invalid image format"
            echo "Expected: ${VERSION}.<pr_number>"
            exit 1
          fi

          # Extract PR number
          PR_NUMBER=$(echo "$IMAGE" | awk -F '.' '{print $3}')

          echo "PR Number: $PR_NUMBER"

          # Verify PR exists
          STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER)

          if [ "$STATUS" -ne 200 ]; then
            echo "PR #$PR_NUMBER does not exist"
            exit 1
          fi

          echo "PR validation successful"

      # Deployment Summary
      - name: Display Deployment Details
        run: |
          echo "=================================="
          echo "Deployment Details"
          echo "=================================="
          echo "Environment : ${{ github.event.inputs.environment }}"
          echo "Branch      : ${{ github.event.inputs.branch }}"
          echo "Image ID    : ${{ github.event.inputs.image_id }}"
          echo "=================================="

      # Azure Login
      - name: Azure Login
        run: |
          echo "Login to Azure here"

      # Deploy
      - name: Deploy to AKS
        run: |

          IMAGE=${{ github.event.inputs.image_id }}
          ENV=${{ github.event.inputs.environment }}

          echo "Deploying image: $IMAGE"
          echo "Environment: $ENV"

          # Example deployment command
          echo "kubectl set image deployment/app app=myrepo:$IMAGE -n $ENV"

      # Success Message
      - name: Deployment Completed
        run: |
          echo "Deployment completed successfully"

#Adding comment to generate the PR for trigger
